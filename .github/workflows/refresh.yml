name: Refresh Toronto internships
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["update.py", "test_update.py", ".github/workflows/refresh.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-listings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate filtering and feed handling
        run: python3 -m unittest -v
      - name: Fetch listings and refresh table
        run: python3 update.py
      - name: Publish changed listings
        if: github.event_name != 'pull_request'
        run: |
          git add README.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh Toronto internships"
            git push
          fi
